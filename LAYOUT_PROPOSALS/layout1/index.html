<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>layout1 - plaza monument</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #151922;
            color: #edf0f4;
            font-family: "Times New Roman", serif;
            overflow-x: hidden;
        }

        .stage {
            position: relative;
            min-height: 100vh;
            display: grid;
            align-items: end;
            padding: 56px;
            overflow: hidden;
        }

        .stage::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url("../../Navigation/assets/home/hero-banner.gif") center / cover;
            opacity: .9;
        }

        .stage::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.82)),
                linear-gradient(90deg, rgba(0,0,0,.65), transparent 45%, rgba(0,0,0,.48));
        }

        .monument {
            position: relative;
            z-index: 2;
            display: grid;
            justify-items: center;
            width: min(1180px, 100%);
            margin: 0 auto;
        }

        .wheel {
            width: min(420px, 54vw);
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #8d96a8;
            box-shadow: 8px 8px 0 rgba(0,0,0,.42);
        }

        .wheel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.08);
            animation: spin 46s linear infinite;
        }

        .plinth {
            width: min(1040px, 100%);
            margin-top: -158px;
            padding: 130px 64px 42px;
            text-align: center;
            border-top: 4px solid #8d96a8;
            border-bottom: 1px solid rgba(255,255,255,.14);
            background: linear-gradient(180deg, rgba(20,24,32,.62), rgba(20,24,32,.9));
            backdrop-filter: blur(2px);
            box-shadow: 8px 8px 0 rgba(0,0,0,.32);
        }

        h1 {
            margin: 0;
            font-size: clamp(54px, 11vw, 140px);
            line-height: .8;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 rgba(0,0,0,.48);
        }

        .routes {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: min(1040px, 100%);
            margin-top: 22px;
        }

        .routes a {
            height: 92px;
            display: flex;
            align-items: end;
            padding: 14px;
            color: inherit;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.045);
            overflow: hidden;
        }

        .routes img {
            position: absolute;
            opacity: .28;
        }

        @keyframes spin {
            from { transform: rotate(0deg) scale(1.08); }
            to { transform: rotate(360deg) scale(1.08); }
        }

        @media (max-width: 760px) {
            .stage {
                padding: 28px;
            }

            .routes {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <img class="layout-bg" src="../../Navigation/assets/home/background.png" alt="">
    <div class="layout-scrim"></div>
    <header class="proposal-header">
        <div class="proposal-banner">
            <img src="../../Navigation/assets/home/hero-banner.gif" alt="">
            <p class="proposal-logo">UNNAMED</p>
        </div>
        <nav class="proposal-nav">
            <a href="../../Navigation/home.html">Home</a>
            <a href="../../Navigation/character_list.html">Characters</a>
            <a href="../../Navigation/timeline_list.html">Timeline</a>
            <a href="../../Navigation/aspects_list.html">Aspects</a>
        </nav>
    </header>
    <aside class="proposal-side">
        <a href="../../Navigation/home.html"><span class="proposal-icon"></span><span>Home</span></a>
        <a href="../../Navigation/character_list.html"><span class="proposal-icon"></span><span>Characters</span></a>
        <a href="../../Navigation/timeline_list.html"><span class="proposal-icon"></span><span>Timeline</span></a>
        <a href="../../Navigation/aspects_list.html"><span class="proposal-icon"></span><span>Aspects</span></a>
    </aside>
    <main class="stage proposal-main">
        <section class="monument">
            <div class="wheel">
                <img src="../../Navigation/assets/home/Overview2.gif" alt="">
            </div>
            <div class="plinth">
                <h1>UNNAMED</h1>
            </div>
            <nav class="routes">
                <a href="../../Navigation/character_list.html">Characters</a>
                <a href="../../Navigation/timeline_list.html">Timeline</a>
                <a href="../../Navigation/aspects_list.html">Aspects</a>
                <a href="../../Navigation/empires_list.html">Empires</a>
                <a href="../../Navigation/regions_list.html">Regions</a>
            </nav>
        </section>
    </main>
</body>
</html>
