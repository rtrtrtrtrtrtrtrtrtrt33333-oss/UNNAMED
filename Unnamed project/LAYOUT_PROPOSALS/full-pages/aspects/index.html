<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Full page - aspects observatory</title>
    <link rel="stylesheet" href="../../shared.css">
    <style>
        .aspect-page {
            min-height: 760px;
            display: grid;
            grid-template-columns: 1fr minmax(320px, 560px);
            gap: 24px;
            align-items: stretch;
        }

        .aspect-field {
            position: relative;
            display: grid;
            place-items: center;
            border: 3px solid #859c8d;
            background:
                linear-gradient(180deg, rgba(15,20,24,.7), rgba(15,20,24,.95)),
                url("https://images.unsplash.com/photo-1566303418941-917448c1df2a?auto=format&fit=crop&ixlib=rb-4.1.0&q=60&w=1400") center / cover;
            box-shadow: 8px 8px 0 rgba(0,0,0,.34);
            overflow: hidden;
        }

        .aspect-field::before {
            content: "";
            position: absolute;
            width: 620px;
            aspect-ratio: 1;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 50%;
            box-shadow:
                inset 0 0 0 82px rgba(255,255,255,.025),
                inset 0 0 0 180px rgba(255,255,255,.018);
            animation: drift 54s linear infinite;
        }

        .aspect-core {
            position: relative;
            z-index: 2;
            width: min(420px, 72vw);
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #859c8d;
            box-shadow: 8px 8px 0 rgba(0,0,0,.34);
        }

        .aspect-core img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .aspect-menu {
            display: grid;
            gap: 14px;
        }

        .aspect-link {
            position: relative;
            min-height: 170px;
            display: flex;
            align-items: end;
            padding: 18px;
            color: #eef2ea;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,.14);
            background: rgba(26,32,37,.92);
            box-shadow: 5px 5px 0 rgba(0,0,0,.25);
            overflow: hidden;
        }

        .aspect-link img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .5;
            transition: transform .32s ease, opacity .32s ease;
        }

        .aspect-link:hover img {
            transform: scale(1.04);
            opacity: .68;
        }

        .aspect-link h2 {
            position: relative;
            z-index: 2;
            margin: 0;
            font-size: clamp(30px, 4vw, 62px);
            line-height: .86;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @keyframes drift {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 980px) {
            .aspect-page {
                grid-template-columns: 1fr;
            }

            .aspect-field {
                min-height: 560px;
            }
        }
    </style>
</head>
<body>
    <img class="layout-bg" src="../../../Navigation/assets/home/background.png" alt="">
    <div class="layout-scrim"></div>
    <header class="proposal-header">
        <div class="proposal-banner"><img src="../../../Navigation/assets/home/hero-banner.gif" alt=""><p class="proposal-logo">UNNAMED</p></div>
        <nav class="proposal-nav"><a href="../../../Navigation/home.html">Home</a><a href="../../../Navigation/character_list.html">Characters</a><a href="../../../Navigation/timeline_list.html">Timeline</a><a href="../../../Navigation/aspects_list.html">Aspects</a></nav>
    </header>
    <aside class="proposal-side">
        <a href="../../../Navigation/home.html"><span class="proposal-icon"></span><span>Home</span></a>
        <a href="../../../Navigation/character_list.html"><span class="proposal-icon"></span><span>Characters</span></a>
        <a href="../../../Navigation/timeline_list.html"><span class="proposal-icon"></span><span>Timeline</span></a>
        <a href="../../../Navigation/aspects_list.html"><span class="proposal-icon"></span><span>Aspects</span></a>
    </aside>
    <main class="proposal-main aspect-page">
        <section class="aspect-field">
            <div class="aspect-core"><img src="../../../Navigation/assets/aspect list/interlayer.png" alt=""></div>

            <a class="aspect-link" href="../../../Aspects/Interlayer/aspect-page.html"><img src="../../../Navigation/assets/aspect list/interlayer.png" alt=""><h2>Interlayer</h2></a>
            <a class="aspect-link" href="../../../Aspects/Old world/aspect-page.html"><img src="../../../Navigation/assets/home/Gallery/mood (3).png" alt=""><h2>Old World</h2></a>
