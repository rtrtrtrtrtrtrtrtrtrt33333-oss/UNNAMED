<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Full page - timeline procession</title>
    <link rel="stylesheet" href="../../shared.css">
    <style>
        .timeline-page {
            position: relative;
            display: grid;
            grid-template-columns: minmax(220px, 360px) 1fr;
            gap: 24px;
        }

        .timeline-monolith {
            min-height: 720px;
            padding: 28px;
            border: 3px solid #8d7663;
            background:
                linear-gradient(180deg, rgba(17,20,27,.72), rgba(17,20,27,.96)),
                url("https://images.unsplash.com/photo-1650804068570-7fb2e3dbf888?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=60&w=1500") center / cover;
            box-shadow: 8px 8px 0 rgba(0,0,0,.34);
        }

        .timeline-monolith h1 {
            margin: 0;
            writing-mode: vertical-rl;
            font-size: clamp(56px, 7vw, 112px);
            line-height: .82;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        .era-road {
            position: relative;
            display: grid;
            gap: 18px;
        }

        .era-road::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 42px;
            width: 2px;
            background: rgba(255,255,255,.16);
        }

        .era-card {
            position: relative;
            min-height: 210px;
            display: grid;
            grid-template-columns: 90px 1fr 260px;
            gap: 18px;
            align-items: stretch;
            padding: 14px;
            border: 1px solid rgba(255,255,255,.13);
            background: rgba(27,32,42,.9);
            box-shadow: 5px 5px 0 rgba(0,0,0,.28);
            overflow: hidden;
        }

        .era-mark {
            position: relative;
            z-index: 2;
            width: 58px;
            height: 58px;
            margin: 20px auto 0;
            border: 2px solid #a48165;
            background: #151922;
            transform: rotate(45deg);
        }

        .era-card h2 {
            align-self: end;
            margin: 0 0 10px;
            font-size: clamp(34px, 5vw, 72px);
            line-height: .86;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .era-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,.12);
        }

        @media (max-width: 980px) {
            .timeline-page {
                grid-template-columns: 1fr;
            }

            .timeline-monolith {
                min-height: 260px;
            }

            .timeline-monolith h1 {
                writing-mode: initial;
            }

            .era-card {
                grid-template-columns: 64px 1fr;
            }

            .era-card img {
                grid-column: 1 / -1;
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <img class="layout-bg" src="../../../Navigation/assets/timeline list/timeline-7.png" alt="">
    <div class="layout-scrim"></div>
    <header class="proposal-header">
        <div class="proposal-banner"><img src="../../../Navigation/assets/home/hero-banner.gif" alt=""><p class="proposal-logo">UNNAMED</p></div>
        <nav class="proposal-nav"><a href="../../../Navigation/home.html">Home</a><a href="../../../Navigation/character_list.html">Characters</a><a href="../../../Navigation/timeline_list.html">Timeline</a><a href="../../../Navigation/aspects_list.html">Aspects</a></nav>
    </header>
    <aside class="proposal-side">
        <a href="../../../Navigation/home.html"><span class="proposal-icon"></span><span>Home</span></a>
        <a href="../../../Navigation/character_list.html"><span class="proposal-icon"></span><span>Characters</span></a>
        <a href="../../../Navigation/timeline_list.html"><span class="proposal-icon"></span><span>Timeline</span></a>
        <a href="../../../Navigation/aspects_list.html"><span class="proposal-icon"></span><span>Aspects</span></a>
    </aside>
    <main class="proposal-main timeline-page">
        <section class="timeline-monolith"><h1>Timeline</h1></section>
        <section class="era-road">
            <article class="era-card"><div class="era-mark"></div><h2>Firstborn Sun</h2><img src="../../../Navigation/assets/timeline list/timeline-1.png" alt=""></article>
            <article class="era-card"><div class="era-mark"></div><h2>Thirteenth Sun</h2><img src="../../../Navigation/assets/timeline list/timeline-2.png" alt=""></article>
            <article class="era-card"><div class="era-mark"></div><h2>Bloodletting</h2><img src="../../../Navigation/assets/timeline list/timeline-7.png" alt=""></article>
            <article class="era-card"><div class="era-mark"></div><h2>Coming Soon</h2><img src="../../../Navigation/assets/timeline list/timeline-8.png" alt=""></article>
        </section>
    </main>
</body>
</html>
