<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>layout7 - dossier stack</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        .stack {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 18px;
            min-height: 760px;
        }

        .sheet {
            position: relative;
            min-height: 680px;
            padding: 24px;
            border: 2px solid rgba(255,255,255,.14);
            background: rgba(31,37,48,.92);
            box-shadow: 8px 8px 0 rgba(0,0,0,.28);
            overflow: hidden;
            transition: transform .24s ease;
        }

        .sheet:nth-child(2) { margin-top: 54px; }
        .sheet:nth-child(3) { margin-top: 108px; }
        .sheet:hover { transform: translateY(-10px); }

        .sheet img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,.14);
        }

        .sheet h2 {
            margin: 22px 0 0;
            font-size: clamp(32px, 4vw, 58px);
            line-height: .88;
            text-transform: uppercase;
        }

        .sheet::after {
            content: "";
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 24px;
            height: 4px;
            background: #8791a3;
            box-shadow: 0 10px 0 rgba(0,0,0,.28);
        }

        @media (max-width: 900px) {
            .stack {
                grid-template-columns: 1fr;
            }

            .sheet:nth-child(n) {
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <img class="layout-bg" src="../../Navigation/assets/home/background.png" alt="">
    <div class="layout-scrim"></div>
    <header class="proposal-header">
        <div class="proposal-banner"><img src="../../Navigation/assets/home/hero-banner.gif" alt=""><p class="proposal-logo">UNNAMED</p></div>
        <nav class="proposal-nav"><a href="../../Navigation/home.html">Home</a><a href="../../Navigation/character_list.html">Characters</a><a href="../../Navigation/timeline_list.html">Timeline</a><a href="../../Navigation/aspects_list.html">Aspects</a></nav>
    </header>
    <aside class="proposal-side">
        <a href="../../Navigation/home.html"><span class="proposal-icon"></span><span>Home</span></a>
        <a href="../../Navigation/character_list.html"><span class="proposal-icon"></span><span>Characters</span></a>
        <a href="../../Navigation/timeline_list.html"><span class="proposal-icon"></span><span>Timeline</span></a>
        <a href="../../Navigation/aspects_list.html"><span class="proposal-icon"></span><span>Aspects</span></a>
    </aside>
    <main class="proposal-main stack">
        <article class="sheet"><img src="../../Characters/Solar Strike/assets/hero/profile.png" alt=""><h2>Solar Strike</h2></article>
        <article class="sheet"><img src="../../Characters/Copper Spire/assets/hero/profile.png" alt=""><h2>Copper Spire</h2></article>
        <article class="sheet"><img src="../../Characters/Incarcerate/assets/hero/profile.png" alt=""><h2>Incarcerate</h2></article>
    </main>
</body>
</html>
