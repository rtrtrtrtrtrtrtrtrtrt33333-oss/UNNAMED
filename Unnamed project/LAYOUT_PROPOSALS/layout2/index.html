<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>layout2 - archive rail</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #121720;
            color: #e7e9ef;
            font-family: "Times New Roman", serif;
        }

        .rail {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 220px 1fr;
        }

        .spine {
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 28px 24px;
            border-right: 1px solid rgba(255,255,255,.12);
            background: #1b202a;
        }

        .spine::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 34px;
            bottom: 34px;
            width: 3px;
            background: #6d7483;
            box-shadow: 12px 0 0 rgba(255,255,255,.08);
        }

        .spine h1 {
            position: relative;
            z-index: 1;
            margin: 0;
            writing-mode: vertical-rl;
            font-size: 56px;
            line-height: .85;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .content {
            padding: 48px;
        }

        .hero-strip {
            position: relative;
            min-height: 420px;
            margin-bottom: 18px;
            overflow: hidden;
            border: 3px solid #6d7483;
            box-shadow: 8px 8px 0 rgba(0,0,0,.34);
        }

        .hero-strip img {
            width: 100%;
            height: 100%;
            min-height: 420px;
            object-fit: cover;
        }

        .moving-line {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 32px;
            height: 5px;
            background: repeating-linear-gradient(90deg, #d7dae2 0 60px, transparent 60px 84px);
            animation: railMove 8s linear infinite;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .card {
            position: relative;
            min-height: 260px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.12);
            background: #252b36;
            box-shadow: 5px 5px 0 rgba(0,0,0,.24);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .84;
            transition: transform .45s ease;
        }

        .card:hover img {
            transform: scale(1.06);
        }

        .card span {
            position: absolute;
            left: 14px;
            bottom: 12px;
            right: 14px;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
        }

        @keyframes railMove {
            from { background-position: 0 0; }
            to { background-position: 168px 0; }
        }

        @media (max-width: 900px) {
            .rail {
                grid-template-columns: 1fr;
            }

            .spine {
                position: relative;
                height: auto;
            }

            .spine h1 {
                writing-mode: initial;
            }

            .cards {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <img class="layout-bg" src="../../Navigation/assets/home/background.png" alt="">
    <div class="layout-scrim"></div>
    <header class="proposal-header">
        <div class="proposal-banner">
            <img src="../../Navigation/assets/home/hero-banner.gif" alt="">
            <p class="proposal-logo">UNNAMED</p>
        </div>
        <nav class="proposal-nav">
            <a href="../../Navigation/home.html">Home</a>
            <a href="../../Navigation/character_list.html">Characters</a>
            <a href="../../Navigation/timeline_list.html">Timeline</a>
            <a href="../../Navigation/aspects_list.html">Aspects</a>
        </nav>
    </header>
    <aside class="proposal-side">
        <a href="../../Navigation/home.html"><span class="proposal-icon"></span><span>Home</span></a>
        <a href="../../Navigation/character_list.html"><span class="proposal-icon"></span><span>Characters</span></a>
        <a href="../../Navigation/timeline_list.html"><span class="proposal-icon"></span><span>Timeline</span></a>
        <a href="../../Navigation/aspects_list.html"><span class="proposal-icon"></span><span>Aspects</span></a>
    </aside>
    <main class="rail proposal-main">
        <aside class="spine">
            <h1>Archive</h1>
        </aside>
        <section class="content">
            <div class="hero-strip">
                <img src="../../Navigation/assets/home/hero-banner.gif" alt="">
                <div class="moving-line"></div>
            </div>
            <div class="cards">
                <a class="card" href="../../Navigation/character_list.html">
                    <img src="../../Navigation/assets/home/bottom sections/character.png" alt="">
                    <span>Characters</span>
                </a>
                <a class="card" href="../../Navigation/timeline_list.html">
                    <img src="../../Navigation/assets/home/bottom sections/Timeline.png" alt="">
                    <span>Timeline</span>
                </a>
                <a class="card" href="../../Navigation/aspects_list.html">
                    <img src="../../Navigation/assets/home/bottom sections/aspect.jpg" alt="">
                    <span>Aspects</span>
                </a>
                <a class="card" href="../../Navigation/home.html">
                    <img src="../../Navigation/assets/home/Gallery/mood (4).png" alt="">
                    <span>Square</span>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
